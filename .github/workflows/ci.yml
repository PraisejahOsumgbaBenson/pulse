name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: pulse:ci
      - name: Check the data volume is writable
        run: |
          set +e
          output=$(docker run --rm -v pulse-ci-data:/data -e TELEGRAM_TOKEN=fake pulse:ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "expected the fake Telegram token to fail"
            exit 1
          fi
          if echo "$output" | grep -qi 'permission denied'; then
            echo "the /data volume is not writable"
            exit 1
          fi
          if ! echo "$output" | grep -q 'verify telegram token'; then
            echo "the app did not reach the Telegram check"
            exit 1
          fi
          docker volume rm pulse-ci-data >/dev/null
